services:
  storage:
    build:
      context: ../..
      dockerfile: examples/docker-compose/Dockerfile
    environment:
      DLSTORAGE_HOST: "0.0.0.0"
      DLSTORAGE_PORT: "7001"
      # ARecordDiscovery resolves this service name to all replica IPs
      # automatically – no static peer list needed.
      DLSTORAGE_DISCOVERY_HOST: "storage"
      DLSTORAGE_LOG_LEVEL: "DEBUG"
    deploy:
      replicas: 3

  # Nginx round-robins HTTP traffic across all storage replicas.
  # Exposes a single port on the host so curl localhost:8000 works.
  gateway:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - storage
