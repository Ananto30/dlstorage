[project]
name = "dlstorage"
version = "0.1.0"
description = "Distributed local storage system for Python objects"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "msgspec>=0.21.1",
    "uvloop>=0.22.1",
]

[project.optional-dependencies]
dns = ["dnspython>=2.0"]

[dependency-groups]
dev = [
    "fastapi>=0.136.3",
    "flask>=3.1.3",
    "isort>=8.0.1",
    "redis>=7.4.0",
    "ruff>=0.15.14",
    "snakeviz>=2.2.2",
    "uvicorn>=0.48.0",
]

[tool.setuptools.packages.find]
include = ["dlstorage*"]
