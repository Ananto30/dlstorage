[project]
name = "dlstorage"
version = "0.1.0"
description = "Distributed local storage with pluggable discovery, rendezvous hashing, and TCP connection pooling"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "redis>=7.4.0",
    "uvloop>=0.22.1",
]

[project.optional-dependencies]
dns = ["dnspython>=2.0"]
